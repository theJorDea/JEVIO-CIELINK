[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cielink"
version = "0.1.0"
description = "CIELINK voice-agent foundations"
requires-python = ">=3.10"

[project.optional-dependencies]
asr = [
    "gigaam[torch] @ git+https://github.com/salute-developers/GigaAM.git@e9bbf2e773eedd217c6f0d3b89b9728c41332b7d",
]
voice-test = [
    "scipy>=1.12",
    "sounddevice>=0.5",
    "websockets>=14",
    "onnxruntime>=1.18",
    "ruaccent>=1.6.0",
    "phonemizer-fork>=3.3.2",
    "misaki>=0.7.4",
    "espeakng-loader>=0.2.4",
    "brotlicffi>=1.2.1.0",
    "omnivoice>=0.2.1",
]
test = ["pytest>=8"]

[project.scripts]
cielink-asr = "cielink_asr.cli:main"
cielink-echo = "cielink_asr.echo:main"
cielink-voice-server = "cielink_asr.voice_server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
