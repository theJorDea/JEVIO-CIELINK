[project]
name = "cielink"
version = "0.1.0"
description = "SkyNet connection assistant — local training environment"
requires-python = ">=3.11,<3.15"
dependencies = ["fastapi>=0.115,<1", "pydantic>=2.10,<3", "uvicorn[standard]>=0.34,<1"]

[project.optional-dependencies]
postgres = [
    "psycopg[binary]>=3.2,<4",
]
livekit = [
    "livekit-agents>=1.8.13,<1.9",
]

[dependency-groups]
dev = ["pytest>=8,<10", "httpx>=0.27,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
