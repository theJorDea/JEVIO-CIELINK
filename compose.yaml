services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: cielink
      POSTGRES_USER: cielink
      POSTGRES_PASSWORD: cielink_local
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./migrations/001_initial.sql:/docker-entrypoint-initdb.d/001_initial.sql:ro
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "cielink", "-d", "cielink"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  pgdata:
