name: Regression tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: training
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      CIELINK_TEST_POSTGRES_URL: postgresql://postgres:training@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked --python 3.13 --extra postgres
      - run: psql "$CIELINK_TEST_POSTGRES_URL" -v ON_ERROR_STOP=1 -f migrations/001_initial.sql -f migrations/002_operations.sql -f migrations/003_spoken_reference.sql
      - run: uv run --locked pytest -q
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/*.test.mjs
      - run: npm ci && npm run build
        working-directory: dashboard
