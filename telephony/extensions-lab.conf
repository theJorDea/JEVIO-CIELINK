; Optional isolated inbound extension. Replace existing-operator,s,1 before use.
[cielink-lab]
exten => 7616,1,Answer()
 same => n,Set(CIELINK_RESULT=OPERATOR)
 same => n,Set(AGISIGHUP=no)
 same => n,Set(EAGI_AUDIO_FORMAT=slin)
 same => n,EAGI(cielink-agi)
 same => n,GotoIf($["${AGISTATUS}" = "SUCCESS" & "${CIELINK_RESULT}" = "DONE"]?done)
 same => n,Goto(existing-operator,s,1)
 same => n(done),Hangup()
